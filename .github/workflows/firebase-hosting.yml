# Publica la app en Firebase Hosting cada vez que guardas un cambio en GitHub.
# No hace falta instalar nada: GitHub corre esto en sus propios servidores.
#
# Requiere un secreto del repositorio llamado FIREBASE_SERVICE_ACCOUNT
# (Settings -> Secrets and variables -> Actions -> New repository secret)
# y cambiar TU-PROYECTO por el projectId real de Firebase.

name: Publicar en Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: valores-ibime
          channelId: live
